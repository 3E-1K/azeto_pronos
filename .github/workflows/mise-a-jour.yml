name: Mise à jour des données

on:
  schedule:
    - cron: "0 6 * * *"    # tous les jours à 7h00 heure du Bénin
    - cron: "0 15 * * 5"   # vendredi 16h00 : cotes du week-end
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Télécharger et calculer les données
        run: node scripts/update.mjs
      - name: Journal des pronos publiés (Nos résultats)
        run: node scripts/journal.mjs
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "azeto-bot"
          git config user.email "azeto-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des données $(date -u +%Y-%m-%d)"
          git push
